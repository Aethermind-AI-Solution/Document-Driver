# Render Blueprint — deploys the Aethermind FastAPI backend.
# Spec: https://render.com/docs/blueprint-spec
# The Next.js frontend is deployed separately on Vercel (see docs/deployment.md).
# If Render rejects `runtime:`, use `env: python` instead (older Blueprint field name).
services:
  - type: web
    name: aethermind-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Only redeploy when backend code (or this blueprint) changes — frontend/docs
    # pushes no longer trigger a backend redeploy (and its free-tier downtime).
    buildFilter:
      paths:
        - backend/**
        - render.yaml
      ignoredPaths:
        - backend/tests/**
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Set to your deployed frontend origin, e.g. https://aethermind.vercel.app
      # (comma-separated for multiple). Without it, only localhost is allowed.
      - key: CORS_ORIGINS
        sync: false
      # Optional. Leave blank to use deterministic fallback extraction (no key needed).
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      # Phase 1 — production persistence & identity (see docs/deployment.md).
      # Postgres connection string, psycopg v3 scheme, e.g.
      # postgresql+psycopg://user:password@host/db
      - key: DATABASE_URL
        sync: false
      # "local" (ephemeral, default) or "s3" (Cloudflare R2 — durable storage)
      - key: STORAGE_BACKEND
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      # Strong random secret used to sign JWTs. Required in production — boot
      # fails fast if unset/default when DATABASE_URL is not sqlite.
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
